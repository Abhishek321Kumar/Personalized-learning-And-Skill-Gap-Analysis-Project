<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md" style="width: 1280px; min-height: 1010px; margin: 0px auto;">
<!-- TopAppBar from JSON -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline full-width top-0 z-50 transition-all duration-200 flex justify-center">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 w-full max-w-[1280px]">
<div class="flex items-center">
<span class="font-label-caps text-label-caps text-primary dark:text-primary-fixed">SkillBridge Quiz</span>
</div>
<div class="flex items-center gap-2 text-primary font-bold">
<span class="material-symbols-outlined">timer</span>
<span class="font-body-md text-body-md">44:58</span>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile md:px-margin-desktop py-8 md:py-12">
<div class="w-full max-w-3xl">
<!-- Progress Section -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Question 20 of 20</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">100%</span>
</div>
<div class="w-full bg-surface-variant h-1">
<div class="bg-primary h-1" style="width: 100%"></div>
</div>
</div>
<!-- Quiz Container / Bento Card -->
<div class="bg-surface-container-lowest border border-outline-variant p-card-padding">
<div class="mb-6 border-b border-outline-variant pb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Data Analysis</span>
</div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg mb-8">
                    Which of the following is a common method for handling missing data in a dataset?
                </h2>
<div class="space-y-4 mb-12">
<!-- Option 1 -->
<label class="flex items-center p-4 border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="form-radio h-5 w-5 text-primary border-outline focus:ring-primary" name="quiz_option" type="radio">
<span class="ml-4 font-body-md text-body-md">Mean/Median Imputation</span>
</label>
<!-- Option 2 -->
<label class="flex items-center p-4 border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="form-radio h-5 w-5 text-primary border-outline focus:ring-primary" name="quiz_option" type="radio">
<span class="ml-4 font-body-md text-body-md">Listwise Deletion</span>
</label>
<!-- Option 3 -->
<label class="flex items-center p-4 border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="form-radio h-5 w-5 text-primary border-outline focus:ring-primary" name="quiz_option" type="radio">
<span class="ml-4 font-body-md text-body-md">Data Augmentation</span>
</label>
<!-- Option 4 -->
<label class="flex items-center p-4 border border-outline-variant cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="form-radio h-5 w-5 text-primary border-outline focus:ring-primary" name="quiz_option" type="radio">
<span class="ml-4 font-body-md text-body-md">All of the above</span>
</label>
</div>
<!-- Navigation Actions -->
<div class="flex justify-between items-center pt-6 border-t border-outline-variant">
<button class="font-button text-button px-6 py-3 border border-outline text-on-surface hover:bg-surface-container-low transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                        Previous
                    </button>
<button class="font-button text-button px-6 py-3 bg-primary-container text-on-primary flex items-center gap-2 hover:bg-primary transition-colors">Submit Assessment <span class="material-symbols-outlined text-sm">arrow_forward</span></button>
</div>
</div>
</div>
</main>




</body></html>
